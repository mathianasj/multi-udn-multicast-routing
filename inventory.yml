---
all:
  hosts:
    localhost:
      ansible_connection: local
  children:
    bastion:
      hosts:
        bastion_vm:
          ansible_host: "{{ bastion_ip | default('BASTION_IP_HERE') }}"
          ansible_user: "{{ bastion.cloud_init_user }}"
          ansible_ssh_private_key_file: "{{ bastion.ssh_key_path }}"
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
